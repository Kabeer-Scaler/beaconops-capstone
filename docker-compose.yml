name: beaconops

services:
  postgres:
    image: postgres:16-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beaconops}
      POSTGRES_USER: ${POSTGRES_USER:-beaconops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beaconops-development-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-beaconops}:${POSTGRES_PASSWORD:-beaconops-development-only}@postgres:5432/${POSTGRES_DB:-beaconops}
      ENVIRONMENT: compose
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
    ports:
      - "8000:8000"
    networks: [internal, edge]
    security_opt: [no-new-privileges:true]

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"
    networks: [edge]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

networks:
  internal:
    internal: true
  edge:

volumes:
  postgres-data:
