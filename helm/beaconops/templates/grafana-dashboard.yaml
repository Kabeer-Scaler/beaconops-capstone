{{- if .Values.monitoring.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "beaconops.fullname" . }}-grafana-dashboard
  labels:
    grafana_dashboard: "1"
    {{- include "beaconops.labels" . | nindent 4 }}
data:
  beaconops.json: |-
    {
      "title": "BeaconOps Application Health",
      "uid": "beaconops-health",
      "schemaVersion": 39,
      "refresh": "15s",
      "time": {"from": "now-1h", "to": "now"},
      "tags": ["beaconops", "fastapi"],
      "panels": [
        {"type":"timeseries","title":"HTTP request rate","id":1,"gridPos":{"h":8,"w":12,"x":0,"y":0},"targets":[{"expr":"sum(rate(http_requests_total{namespace=\"{{ .Release.Namespace }}\"}[5m])) by (handler, method)","legendFormat":"{{`{{method}} {{handler}}`}}"}],"fieldConfig":{"defaults":{"unit":"reqps"}}},
        {"type":"timeseries","title":"p95 request latency","id":2,"gridPos":{"h":8,"w":12,"x":12,"y":0},"targets":[{"expr":"histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace=\"{{ .Release.Namespace }}\"}[5m])) by (le, handler))","legendFormat":"{{`{{handler}}`}}"}],"fieldConfig":{"defaults":{"unit":"s"}}},
        {"type":"stat","title":"5xx errors (5m)","id":3,"gridPos":{"h":5,"w":8,"x":0,"y":8},"targets":[{"expr":"sum(increase(http_requests_total{namespace=\"{{ .Release.Namespace }}\",status=~\"5..\"}[5m]))"}],"fieldConfig":{"defaults":{"color":{"mode":"thresholds"},"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"red","value":1}]}}}},
        {"type":"stat","title":"Backend pods ready","id":4,"gridPos":{"h":5,"w":8,"x":8,"y":8},"targets":[{"expr":"sum(kube_deployment_status_replicas_ready{namespace=\"{{ .Release.Namespace }}\",deployment=~\".*backend\"})"}]},
        {"type":"timeseries","title":"Backend CPU","id":5,"gridPos":{"h":5,"w":8,"x":16,"y":8},"targets":[{"expr":"sum(rate(container_cpu_usage_seconds_total{namespace=\"{{ .Release.Namespace }}\",container=\"backend\"}[5m]))","legendFormat":"CPU cores"}]}
      ]
    }
{{- end }}
