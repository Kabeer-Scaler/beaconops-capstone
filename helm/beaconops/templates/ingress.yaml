{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "beaconops.fullname" . }}
  labels:
    {{- include "beaconops.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - secretName: {{ .Values.ingress.tls.secretName }}
      {{- if .Values.ingress.host }}
      hosts: [{{ .Values.ingress.host | quote }}]
      {{- end }}
  {{- end }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "beaconops.fullname" . }}-backend
                port: {name: http}
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: {{ include "beaconops.fullname" . }}-backend
                port: {name: http}
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: {{ include "beaconops.fullname" . }}-backend
                port: {name: http}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "beaconops.fullname" . }}-frontend
                port: {name: http}
{{- end }}
