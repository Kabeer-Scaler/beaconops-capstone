apiVersion: v1
kind: Secret
metadata:
  name: {{ include "beaconops.fullname" . }}-database
  labels:
    {{- include "beaconops.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "beaconops.databaseUrl" . | quote }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.password | quote }}
  {{- end }}
